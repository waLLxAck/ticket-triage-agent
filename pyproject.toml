[project]
name = "triage"
version = "0.1.0"
description = "Learning project: an LLM agent that triages support tickets for Acme Pay, a fictional fintech"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.12",
    "fastapi>=0.165.0",
    "langchain-aws>=1.10.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "mangum>=0.22.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
triage = "triage.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
lint.ignore = ["SIM905"]  # "a b c".split() reads better for word lists

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "botocore[crt]>=1.44.12",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]
